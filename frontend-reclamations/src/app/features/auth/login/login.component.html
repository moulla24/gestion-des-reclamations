<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Connexion</h2>
      <p>Connectez-vous à votre compte</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="Entrez votre email"
          required 
          #emailInput="ngModel"
        />
        <div *ngIf="emailInput.invalid && emailInput.touched" class="error-message">
          Veuillez entrer un email valide
        </div>
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <input 
          type="password" 
          id="motDePasse" 
          [(ngModel)]="motDePasse" 
          name="motDePasse" 
          placeholder="Entrez votre mot de passe"
          required 
          #passwordInput="ngModel"
        />
        <div *ngIf="passwordInput.invalid && passwordInput.touched" class="error-message">
          Le mot de passe est requis
        </div>
      </div>

      <div *ngIf="error" class="error-alert">
        <i class="error-icon">⚠️</i>
        {{ error }}
      </div>

      <button type="submit" class="login-btn" [disabled]="loginForm.invalid || loading">
        <span *ngIf="loading" class="loading-spinner">⏳</span>
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <div class="register-link">
      <p>Vous n'avez pas de compte ?</p>
      <button class="register-btn" (click)="goToRegister()">
        Créer un compte
      </button>
    </div>
  </div>
</div>
