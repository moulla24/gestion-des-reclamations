# ========================================
# CONFIGURATION DE LA BASE DE DONNÉES (MySQL via WAMP)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/reclamations_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# CONFIGURATION DE JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ========================================
# PORT DU SERVEUR WEB
# (optionnel, si tu veux changer le port 8080)
# server.port=8081

# ========================================
# CONFIGURATION DEVTOOLS (rechargement auto)
# ========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true



# JWT
jwt.secret=mysupersecretkeyformyjwtsecuritykeyforbamis123456
jwt.expiration=86400000 
